name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.HAKU_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/haku.jks"
            echo "Using keystore from repository secret"
          elif [ -f signing/haku.jks ]; then
            cp signing/haku.jks "$RUNNER_TEMP/haku.jks"
            echo "Using committed keystore"
          fi
          if [ -f "$RUNNER_TEMP/haku.jks" ]; then
            echo "HAKU_KEYSTORE=$RUNNER_TEMP/haku.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          HAKU_KEYSTORE_PASSWORD: ${{ secrets.HAKU_KEYSTORE_PASSWORD || 'haku-sideload' }}
          HAKU_KEY_ALIAS: haku
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/haku-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: haku-apk
          path: out/*.apk

      - name: Publish release (for Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Haku 0.1.${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}
          files: out/*.apk
          make_latest: true
